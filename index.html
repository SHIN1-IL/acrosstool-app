<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>AcrossTool</title>
  <link rel="icon" href="/images/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=wall1">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script src="/js/theme.js"></script>
</head>
<body class="page-home is-preview" data-i18n-title="meta.home">

  <header class="site-header">
    <div class="site-header__left">
      <a href="/" class="home-btn" id="home-btn" data-i18n-aria="nav.home" aria-label="Home">
        <img src="/images/home-button.svg" alt="" class="home-btn__img">
      </a>
      <nav class="site-nav" data-i18n-aria="nav.menu" aria-label="Main menu">
        <a href="/projects" class="nav-link" data-i18n="nav.projects">Project</a>
        <a href="/contact" class="nav-link" data-i18n="nav.contact">Contact</a>
      </nav>
    </div>
    <div class="lang-switch" role="group" data-i18n-aria="nav.language" aria-label="Language">
      <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
      <span class="lang-switch__sep" aria-hidden="true">/</span>
      <button type="button" class="lang-switch__btn" data-lang="ko">KO</button>
    </div>
  </header>

  <main class="hero">
    <div class="hero-stage">
      <div class="hero-copy">
        <div class="hero-title-wrap">
          <h1 class="hero-title">AcrossTool</h1>
        </div>
        <p class="hero-subtitle" data-i18n="home.subtitle">AcrossTool Crafting Ideas through Development</p>
      </div>
      <aside class="home-preview" id="home-preview" aria-label="Robot">
        <div class="home-robot-stage">
          <canvas id="home-robot" class="home-robot" aria-hidden="true"></canvas>
        </div>
        <div class="home-preview__list" id="home-preview-list" hidden></div>
      </aside>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/projects-data.js"></script>
  <script src="/js/home-preview.js"></script>
  <script type="module">
    import("/js/home-robot.js").catch((error) => {
      document.body.dataset.robotError = String(error);
    });
  </script>
  <script src="/js/main.js"></script>
</body>
</html>
